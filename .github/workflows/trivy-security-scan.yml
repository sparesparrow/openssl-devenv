name: Trivy Security Scan

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Run daily at 2 AM UTC
        - cron: "0 2 * * *"
    workflow_dispatch:

env:
    TRIVY_VERSION: "0.50.0"
    SEVERITY_THRESHOLD: "HIGH"

jobs:
    trivy-filesystem-scan:
        name: Filesystem Scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
            actions: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install Trivy
              run: |
                  sudo apt-get update
                  sudo apt-get install wget apt-transport-https gnupg lsb-release
                  wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
                  echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
                  sudo apt-get update
                  sudo apt-get install trivy

            - name: Run Trivy filesystem scan
              run: |
                  echo "Running Trivy filesystem scan..."
                  trivy fs \
                    --format sarif \
                    --output trivy-filesystem.sarif \
                    --severity CRITICAL,HIGH,MEDIUM \
                    --exit-code 1 \
                    .

            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with:
                  sarif_file: "trivy-filesystem.sarif"
                  category: "trivy-filesystem"

            - name: Generate security report
              run: |
                  echo "## Trivy Security Scan Results" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Component | Status | Vulnerabilities |" >> $GITHUB_STEP_SUMMARY
                  echo "|-----------|--------|----------------|" >> $GITHUB_STEP_SUMMARY

                  # Count vulnerabilities by severity
                  if [ -f "trivy-filesystem.sarif" ]; then
                    critical_count=$(grep -c '"severity": "error"' trivy-filesystem.sarif || echo "0")
                    high_count=$(grep -c '"severity": "warning"' trivy-filesystem.sarif || echo "0")
                    medium_count=$(grep -c '"severity": "note"' trivy-filesystem.sarif || echo "0")
                    
                    echo "| Filesystem | $([ $critical_count -eq 0 ] && echo "✅ Pass" || echo "❌ Fail") | Critical: $critical_count, High: $high_count, Medium: $medium_count |" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "| Filesystem | ⚠️ No results | Scan may have failed |" >> $GITHUB_STEP_SUMMARY
                  fi

    trivy-container-scan:
        name: Container Scan
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event_name == 'schedule'
        permissions:
            contents: read
            security-events: write
            actions: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install Trivy
              run: |
                  sudo apt-get update
                  sudo apt-get install wget apt-transport-https gnupg lsb-release
                  wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
                  echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
                  sudo apt-get update
                  sudo apt-get install trivy

            - name: Build test containers
              run: |
                  # Build containers for scanning (if any exist)
                  if [ -f "Dockerfile" ]; then
                    docker build -t openssl-test:latest .
                  fi

                  # Build Conan containers for testing
                  if [ -f "openssl-tools/docker/Dockerfile" ]; then
                    cd openssl-tools/docker
                    docker build -t openssl-tools:latest .
                    cd ../..
                  fi

            - name: Run Trivy container scan
              run: |
                  echo "Running Trivy container scan..."

                  # Scan base images used in development
                  local_images=()

                  if docker images | grep -q "openssl-test"; then
                    local_images+=("openssl-test:latest")
                  fi

                  if docker images | grep -q "openssl-tools"; then
                    local_images+=("openssl-tools:latest")
                  fi

                  # Scan common base images
                  base_images=("ubuntu:22.04" "alpine:3.18" "python:3.11-slim")

                  for image in "${local_images[@]}" "${base_images[@]}"; do
                    echo "Scanning image: $image"
                    trivy image \
                      --format sarif \
                      --output "trivy-container-$(echo $image | tr '/' '_' | tr ':' '_').sarif" \
                      --severity CRITICAL,HIGH \
                      --exit-code 0 \
                      "$image" || true
                  done

            - name: Upload container scan results
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with:
                  sarif_file: "trivy-container-*.sarif"
                  category: "trivy-container"

    trivy-dependency-scan:
        name: Dependency Scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
            actions: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install Trivy
              run: |
                  sudo apt-get update
                  sudo apt-get install wget apt-transport-https gnupg lsb-release
                  wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
                  echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
                  sudo apt-get update
                  sudo apt-get install trivy

            - name: Install Conan
              run: pip install conan

            - name: Scan Python dependencies
              run: |
                  echo "Scanning Python dependencies..."

                  # Find Python requirements files
                  find . -name "requirements*.txt" -o -name "pyproject.toml" -o -name "setup.py" | while read -r file; do
                    echo "Scanning dependencies in: $file"
                    trivy fs \
                      --format sarif \
                      --output "trivy-python-$(basename $(dirname $file)).sarif" \
                      --severity CRITICAL,HIGH \
                      --exit-code 0 \
                      "$(dirname $file)" || true
                  done

            - name: Scan Conan dependencies
              run: |
                  echo "Scanning Conan dependencies..."

                  # Create a test environment to scan Conan packages
                  mkdir -p conan-scan
                  cd conan-scan

                  # Create a simple conanfile to pull dependencies
                  cat > conanfile.txt << EOF
                  [requires]
                  openssl/4.0.0-dev@sparesparrow/stable
                  openssl-tools/1.2.4@sparesparrow/stable
                  openssl-base/1.0.1@sparesparrow/stable
                  openssl-fips-data/140-3.2@sparesparrow/stable
                  EOF

                  # Install dependencies
                  conan install . --build=missing || true

                  # Scan the installed packages
                  trivy fs \
                    --format sarif \
                    --output "../trivy-conan.sarif" \
                    --severity CRITICAL,HIGH \
                    --exit-code 0 \
                    . || true

                  cd ..

            - name: Upload dependency scan results
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with:
                  sarif_file: "trivy-*.sarif"
                  category: "trivy-dependency"

    security-summary:
        name: Security Summary
        runs-on: ubuntu-latest
        needs:
            [trivy-filesystem-scan, trivy-container-scan, trivy-dependency-scan]
        if: always()
        permissions:
            contents: read
            security-events: read
            actions: read

        steps:
            - name: Generate security summary
              run: |
                  echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Scan Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
                  echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Scan Type | Status | Details |" >> $GITHUB_STEP_SUMMARY
                  echo "|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Filesystem | ${{ needs.trivy-filesystem-scan.result == 'success' && '✅ Pass' || '❌ Issues Found' }} | Source code and configuration files |" >> $GITHUB_STEP_SUMMARY
                  echo "| Container | ${{ needs.trivy-container-scan.result == 'success' && '✅ Pass' || '⚠️ Skipped' }} | Docker images and base images |" >> $GITHUB_STEP_SUMMARY
                  echo "| Dependencies | ${{ needs.trivy-dependency-scan.result == 'success' && '✅ Pass' || '❌ Issues Found' }} | Python and Conan dependencies |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "- Review findings in the [Security tab](https://github.com/${{ github.repository }}/security)" >> $GITHUB_STEP_SUMMARY
                  echo "- Address any CRITICAL or HIGH severity vulnerabilities" >> $GITHUB_STEP_SUMMARY
                  echo "- Update dependencies with known vulnerabilities" >> $GITHUB_STEP_SUMMARY
                  echo "- Consider enabling Dependabot for automated dependency updates" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "### Security Best Practices" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "- 🔄 Run security scans regularly (daily scheduled)" >> $GITHUB_STEP_SUMMARY
                  echo "- 📋 Review and address findings promptly" >> $GITHUB_STEP_SUMMARY
                  echo "- 🔐 Keep dependencies up to date" >> $GITHUB_STEP_SUMMARY
                  echo "- 🛡️ Use minimal base images in containers" >> $GITHUB_STEP_SUMMARY
                  echo "- 📊 Monitor security trends over time" >> $GITHUB_STEP_SUMMARY
