# GitHub Actions Secrets and Variables Contract
# This file documents the standardized secrets and variables used across OpenSSL workflows

## Secrets Contract (GitHub Environment/Repository Secrets)

### Required Secrets (Organization/Repository Level)
- **CLOUDSMITH_API_KEY**: API key for Cloudsmith package registry
  - Used for: Package publishing and authentication
  - Permissions: Read/Write access to Cloudsmith repositories
  - Source: Organization secrets (for shared access) or Repository secrets

- **CONAN_GITHUB_TOKEN**: GitHub token for GitHub Packages access
  - Used for: GitHub Packages publishing and consumption
  - Permissions: packages:write, contents:read
  - Source: Repository secrets (requires repo scope)

- **OPENSSL_REPO_TOKEN**: Token for private repository access
  - Used for: Checking out private repositories, status reporting
  - Permissions: repo (full access to private repos)
  - Source: Organization secrets

- **ARTIFACTORY_USERNAME**: Artifactory username (if using Artifactory)
  - Used for: Artifactory authentication
  - Permissions: Read/Write access to Artifactory repositories
  - Source: Repository secrets

- **ARTIFACTORY_PASSWORD** or **ARTIFACTORY_TOKEN**: Artifactory authentication
  - Used for: Artifactory login and uploads
  - Permissions: API access to Artifactory
  - Source: Repository secrets

- **GH_TOKEN**: Optional token for cross-repository operations
  - Used for: Workflow dispatch, PR automation
  - Permissions: repo, workflow
  - Source: Repository secrets

## Variables Contract (GitHub Repository Variables)

### Required Variables (Repository Level)
- **CONAN_REPOSITORY_NAME**: Conan remote name
  - Default: "sparesparrow-conan"
  - Used for: Conan remote configuration
  - Type: String

- **CONAN_REPOSITORY_URL**: Conan remote URL
  - Default: "https://conan.cloudsmith.io/sparesparrow-conan/openssl-conan/"
  - Used for: Conan remote configuration
  - Type: String

- **CONAN_VERSION**: Conan version to use
  - Default: "2.0.17"
  - Used for: Conan installation in workflows
  - Type: String

- **PYTHON_VERSION**: Python version for workflows
  - Default: "3.12"
  - Used for: Python setup in workflows
  - Type: String

### Optional Variables
- **GITHUB_PACKAGES_URL**: GitHub Packages URL override
  - Default: Auto-generated from repository owner
  - Used for: GitHub Packages remote configuration
  - Type: String

- **ARTIFACTORY_URL**: Artifactory base URL
  - Default: None (disabled if not set)
  - Used for: Artifactory remote configuration
  - Type: String

## Usage Patterns

### Preflight Check Pattern
```yaml
- name: Preflight secrets/vars
  run: |
    missing=0
    test -n "${{ secrets.CLOUDSMITH_API_KEY }}" || { echo "Missing secret: CLOUDSMITH_API_KEY"; missing=1; }
    test -n "${{ env.CONAN_REPOSITORY_NAME }}" || { echo "Missing var: CONAN_REPOSITORY_NAME"; missing=1; }
    if [ "$missing" -ne 0 ]; then exit 1; fi
```

### Remote Configuration Pattern
```yaml
- name: Configure Conan remotes
  run: |
    conan remote add ${{ vars.CONAN_REPOSITORY_NAME }} ${{ vars.CONAN_REPOSITORY_URL }} --force
    conan remote login ${{ vars.CONAN_REPOSITORY_NAME }} spare-sparrow --password "${{ secrets.CLOUDSMITH_API_KEY }}"
```

### Environment Setup Pattern
```yaml
env:
  CONAN_REPOSITORY_NAME: ${{ vars.CONAN_REPOSITORY_NAME || 'sparesparrow-conan' }}
  CONAN_REPOSITORY_URL: ${{ vars.CONAN_REPOSITORY_URL || 'https://conan.cloudsmith.io/sparesparrow-conan/openssl-conan/' }}
  CONAN_VERSION: ${{ vars.CONAN_VERSION || '2.0.17' }}
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
```

## Security Guidelines

### Secrets Management
- Store secrets in GitHub Organization secrets for shared access across repositories
- Use Repository secrets only when organization-level access is not required
- Rotate secrets regularly (every 90 days)
- Limit secret access to required workflows only
- Audit secret usage in workflow logs

### Variables Management
- Use Repository variables for configuration that may vary between environments
- Fallback to sensible defaults for optional variables
- Document variable purposes and expected values
- Use environment-specific variables for different deployment targets

## Setup Instructions

1. **Organization Secrets** (for shared access):
   - Go to Organization Settings > Secrets and variables > Actions
   - Add: CLOUDSMITH_API_KEY, OPENSSL_REPO_TOKEN

2. **Repository Secrets** (for repo-specific access):
   - Go to Repository Settings > Secrets and variables > Actions
   - Add: CONAN_GITHUB_TOKEN, ARTIFACTORY_USERNAME, ARTIFACTORY_PASSWORD, GH_TOKEN

3. **Repository Variables**:
   - Go to Repository Settings > Secrets and variables > Actions
   - Add: CONAN_REPOSITORY_NAME, CONAN_REPOSITORY_URL, CONAN_VERSION, PYTHON_VERSION
   - Optionally: GITHUB_PACKAGES_URL, ARTIFACTORY_URL

4. **Test Configuration**:
   - Run a workflow with workflow_dispatch to verify secrets/vars are accessible
   - Check workflow logs for authentication errors

This contract ensures consistent and secure handling of sensitive information across all OpenSSL workflows.
